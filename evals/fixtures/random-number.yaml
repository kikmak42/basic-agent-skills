skill: random-number
description: generates random numbers
cases:
  - id: random-number::d6
    input: "roll a d6"
    args: ["--min", "1", "--max", "6"]
    trigger: true
    expected_script: "random_number"
    assertions:
      type: int
      min: 1
      max: 6
  - id: random-number::float_val
    input: "random float"
    args: ["--type", "float", "--min", "0", "--max", "1"]
    trigger: true
    expected_script: "random_number"
    assertions:
      type: float
      min: 0
      max: 1
  - id: random-number::count_5
    input: "5 random numbers"
    args: ["--count", "5"]
    trigger: true
    expected_script: "random_number"
    assertions:
      count: 5
